name: Obsidian Android validation and release

on:
  push:
    branches: [main, native-media]
  workflow_dispatch:
    inputs:
      publish_release:
        description: Build, sign, and publish a public Obsidian APK release
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  validate:
    name: Validate Android JavaScript bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate Expo configuration
        run: npx expo config --type public

      - name: Bundle Android JavaScript
        run: npx expo export --platform android --no-bytecode --no-minify --output-dir /tmp/obsidian-ci-export

  build_apk:
    name: Build debug test APK (not for distribution)
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Build Rust audio library
        run: |
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --locked
          cd native/b24audio
          cargo ndk -t arm64-v8a -o ../../modules/b24-media/android/src/main/jniLibs build --release
          ls -l ../../modules/b24-media/android/src/main/jniLibs/arm64-v8a/libb24audio.so

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean

      - name: Set CI versionCode
        run: |
          sed -i -E "s/(versionCode )[0-9]+/\1${{ github.run_number }}/" android/app/build.gradle

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug -PreactNativeArchitectures=arm64-v8a --stacktrace

      - name: Upload debug test APK
        uses: actions/upload-artifact@v4
        with:
          name: obsidian-debug-test-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  release:
    name: Build and publish signed Obsidian APK
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment: production-release

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Build Rust audio library
        run: |
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --locked
          cd native/b24audio
          cargo ndk -t arm64-v8a -o ../../modules/b24-media/android/src/main/jniLibs build --release
          ls -l ../../modules/b24-media/android/src/main/jniLibs/arm64-v8a/libb24audio.so

      - name: Expo prebuild
        run: npx expo prebuild --platform android --clean

      - name: Protect signing material
        run: |
          if git ls-files | grep -Eq '(^|/)(release\.keystore|keystore_base64\.txt)$'; then
            echo "::error::Signing material is tracked in source."
            exit 1
          fi

      - name: Set release versionCode
        run: |
          sed -i -E "s/(versionCode )[0-9]+/\1${{ github.run_number }}/" android/app/build.gradle
          grep -n "versionCode" android/app/build.gradle

      - name: Configure Gradle memory
        run: |
          cat >> android/gradle.properties <<'PROPS'
          org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
          org.gradle.workers.max=2
          org.gradle.parallel=false
          kotlin.daemon.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m
          PROPS

      - name: Check secrets and decode keystore
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required signing secret $name is missing."
              exit 1
            fi
          done

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/release.keystore

          test -s app/release.keystore

          keytool -list \
            -keystore app/release.keystore \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS"

      - name: Configure release signing in Gradle
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle")
          content = path.read_text()

          needle = "    signingConfigs {"
          if needle not in content:
              raise SystemExit("Existing signingConfigs block not found.")

          signing = '''    signingConfigs {
                  release {
                      storeFile file("release.keystore")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }'''

          content = content.replace(needle, signing, 1)

          build_types = content.find("    buildTypes {")
          if build_types == -1:
              raise SystemExit("buildTypes block not found.")

          release_block = content.find("        release {", build_types)
          if release_block == -1:
              raise SystemExit("Release build type not found.")

          tail = content[release_block:]
          old = "signingConfig signingConfigs.debug"

          if old not in tail:
              raise SystemExit("Expected release debug-signing reference not found.")

          tail = tail.replace(
              old,
              "signingConfig signingConfigs.release",
              1
          )

          content = content[:release_block] + tail
          path.write_text(content)

          print("Release signing configured successfully.")
          PY

      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -x lintVitalAnalyzeRelease \
            -PreactNativeArchitectures=arm64-v8a \
            --stacktrace

      - name: Verify APK signature and certificate
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BUILD_TOOLS="$(ls "$SDK/build-tools" | sort -V | tail -n 1)"
          APKSIGNER="$SDK/build-tools/$BUILD_TOOLS/apksigner"

          test -s "$APK"
          test -x "$APKSIGNER"

          "$APKSIGNER" verify --verbose --print-certs "$APK"

          APK_CERT=$("$APKSIGNER" verify --print-certs "$APK" 2>&1 |
            awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print $2; exit}' |
            tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]')

          KEY_CERT=$(keytool -list -v \
            -keystore app/release.keystore \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" 2>&1 |
            awk -F': ' '/SHA256:/ {print $2; exit}' |
            tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]')

          if [ -z "$APK_CERT" ] || [ -z "$KEY_CERT" ]; then
            echo "::error::Could not retrieve signing certificate fingerprints."
            exit 1
          fi

          if [ "$APK_CERT" != "$KEY_CERT" ]; then
            echo "::error::APK certificate does not match the release keystore."
            exit 1
          fi

          echo "APK signature verified."
          echo "APK certificate matches the configured keystore."

      - name: Upload verified signed APK
        uses: actions/upload-artifact@v4
        with:
          name: obsidian-release-apk-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk \
            "Obsidian-v${{ github.run_number }}.apk"

          gh release create "v${{ github.run_number }}" \
            "Obsidian-v${{ github.run_number }}.apk" \
            --repo "${{ github.repository }}" \
            --title "Obsidian build ${{ github.run_number }}" \
            --generate-notes \
            --latest
