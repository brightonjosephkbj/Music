name: Build Signed Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm install

      - name: Expo prebuild (generate native Android project)
        run: npx expo prebuild --platform android --clean

      - name: Fix Gradle Metaspace OOM
        run: |
          echo "" >> android/gradle.properties
          cat >> android/gradle.properties << 'PROPSEOF'
          org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
          org.gradle.workers.max=2
          org.gradle.parallel=false
          kotlin.daemon.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m
          PROPSEOF
          echo "--- android/gradle.properties ---"
          cat android/gradle.properties

      - name: Decode keystore and configure signing
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/release.keystore
          python3 << 'GRADLEEOF'
          with open("app/build.gradle") as f:
              content = f.read()
          signing_block = '''    signingConfigs {
              release {
                  storeFile file('release.keystore')
                  storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                  keyAlias System.getenv("ANDROID_KEY_ALIAS")
                  keyPassword System.getenv("ANDROID_KEY_PASSWORD")
              }
          }
          '''
          content = content.replace("android {\n", "android {\n" + signing_block, 1)
          content = content.replace(
              "signingConfig signingConfigs.debug",
              "signingConfig signingConfigs.release"
          )
          with open("app/build.gradle", "w") as f:
              f.write(content)
          GRADLEEOF
          echo "--- signingConfigs block check ---"
          grep -A 6 "signingConfigs {" app/build.gradle

      - name: Build release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --stacktrace --info

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: obsidian-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
