[package]
name = "b24audio"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "b24audio_cli"
path = "src/main.rs"

[dependencies]
symphonia = { version = "0.5", default-features = false, features = ["aac", "isomp4", "mp3"] }
mp3lame-encoder = "0.2"

[profile.release]
opt-level = 3

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
